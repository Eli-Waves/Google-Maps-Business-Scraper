<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Web GH Live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111b21;
    --sidebar: #202c33;
    --chat-bg: #0b141a;
    --hover: #2a3942;
    --border: #2a3942;
    --text: #e9edef;
    --muted: #8696a0;
    --green: #00a884;
    --green-dark: #005c4b;
    --bubble-out: #005c4b;
    --bubble-in: #202c33;
    --orange: #ff9800;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar {
    width: 380px; display: flex; flex-direction: column;
    background: var(--sidebar); border-right: 1px solid var(--border);
    transition: transform 0.25s ease;
  }

  .sidebar-header {
    padding: 12px 16px; height: 58px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 { font-size: 1.1rem; font-weight: 600; }
  .live { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--green); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .stats {
    display: grid; grid-template-columns: repeat(4,1fr);
    border-bottom: 1px solid var(--border);
  }
  .stat { padding: 8px 4px; text-align: center; cursor: pointer; }
  .stat:not(:last-child) { border-right: 1px solid var(--border); }
  .stat .n { font-size: 1.25rem; font-weight: 700; }
  .stat .l { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat.hot .n { color: var(--orange); }
  .stat.ok .n { color: var(--green); }

  .search { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .search input {
    width: 100%; background: var(--chat-bg); border: none; border-radius: 8px;
    padding: 8px 12px; color: var(--text); font-size: 0.85rem; font-family: inherit; outline: none;
  }
  .search input::placeholder { color: var(--muted); }

  .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 9px 14px; font-size: 0.72rem; color: var(--muted);
    white-space: nowrap; cursor: pointer; border-bottom: 2px solid transparent;
    transition: all .2s;
  }
  .tab.active { color: var(--green); border-bottom-color: var(--green); }

  .list { overflow-y: auto; flex: 1; }
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 16px; cursor: pointer;
    border-bottom: 1px solid rgba(42,57,66,.4);
    transition: background .15s;
  }
  .item:active, .item.active { background: var(--hover); }

  .av {
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 1rem;
    background: var(--green-dark); color: var(--green);
  }
  .av.hot { background: #3d2000; color: var(--orange); }
  .av.converted { background: #002d1f; color: #4cff9f; }
  .av.unknown { background: #2d1500; color: #ffaa44; }

  .info { flex: 1; min-width: 0; }
  .name { font-weight: 500; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview { font-size: 0.76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  .bdg {
    font-size: 0.58rem; padding: 2px 7px; border-radius: 10px; font-weight: 600; white-space: nowrap;
  }
  .bdg.interested { background: rgba(255,152,0,.2); color: var(--orange); }
  .bdg.contacted { background: rgba(0,168,132,.15); color: var(--green); }
  .bdg.converted { background: rgba(76,255,159,.15); color: #4cff9f; }
  .bdg.new { background: rgba(134,150,160,.15); color: var(--muted); }
  .bdg.unknown { background: rgba(255,170,68,.15); color: #ffaa44; }

  /* ── Chat panel ── */
  .chat {
    flex: 1; display: flex; flex-direction: column;
    background: var(--chat-bg);
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23182229' fill-opacity='.35'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
  }

  .chat-header {
    background: var(--sidebar); padding: 8px 16px; height: 58px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .back-btn {
    display: none; background: none; border: none; color: var(--green);
    font-size: 1.4rem; cursor: pointer; padding: 4px 8px 4px 0; line-height: 1;
  }
  .chat-av { width: 38px; height: 38px; border-radius: 50%; background: var(--green-dark); color: var(--green); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9rem; }
  .chat-info .cname { font-weight: 500; font-size: 0.9rem; }
  .chat-info .csub { font-size: 0.7rem; color: var(--muted); }

  .messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 3px; }
  .bubble { max-width: 72%; padding: 7px 11px; border-radius: 8px; font-size: 0.83rem; line-height: 1.45; }
  .bubble.out { background: var(--bubble-out); align-self: flex-end; border-radius: 8px 0 8px 8px; }
  .bubble.in { background: var(--bubble-in); align-self: flex-start; border-radius: 0 8px 8px 8px; }
  .bubble .t { font-size: 0.62rem; color: rgba(255,255,255,.35); margin-top: 3px; text-align: right; }

  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--muted); gap: 12px; padding: 20px; text-align: center;
  }
  .empty-state svg { width: 64px; height: 64px; opacity: .25; }
  .empty-state p { font-size: 0.82rem; }

  /* ── Mobile ── */
  @media (max-width: 680px) {
    body { position: relative; }
    .sidebar { width: 100%; position: fixed; inset: 0; z-index: 10; transform: translateX(0); }
    .sidebar.hidden { transform: translateX(-100%); }
    .chat { position: fixed; inset: 0; z-index: 10; }
    .chat.hidden { transform: translateX(100%); }
    .back-btn { display: block; }
  }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>Web GH</h1>
    <div class="live"><div class="dot"></div><span id="upd">Live</span></div>
  </div>

  <div class="stats">
    <div class="stat" onclick="setFilter('all')"><div class="n" id="st">0</div><div class="l">Total</div></div>
    <div class="stat" onclick="setFilter('contacted')"><div class="n" id="sc">0</div><div class="l">Sent</div></div>
    <div class="stat hot" onclick="setFilter('interested')"><div class="n" id="si">0</div><div class="l">Hot</div></div>
    <div class="stat ok" onclick="setFilter('converted')"><div class="n" id="sv">0</div><div class="l">Clients</div></div>
  </div>

  <div class="search"><input id="q" placeholder="Search…" oninput="render()"></div>

  <div class="tabs">
    <div class="tab active" onclick="setFilter('all')">All</div>
    <div class="tab" onclick="setFilter('interested')">🔥 Hot</div>
    <div class="tab" onclick="setFilter('replied')">Replied</div>
    <div class="tab" onclick="setFilter('contacted')">No Reply</div>
    <div class="tab" onclick="setFilter('unknown')">Unknown</div>
    <div class="tab" onclick="setFilter('converted')">Clients</div>
  </div>

  <div class="list" id="list"></div>
</div>

<div class="chat hidden" id="chat">
  <div class="chat-header" id="chat-header">
    <button class="back-btn" onclick="goBack()">‹</button>
    <div class="chat-av" id="cav">?</div>
    <div class="chat-info">
      <div class="cname" id="cname">—</div>
      <div class="csub" id="csub">—</div>
    </div>
  </div>
  <div class="messages" id="msgs">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      <p>Select a conversation</p>
    </div>
  </div>
</div>

<script>
let leads=[], filter='all', active=null;

function ini(n){ return (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function avCls(l){ return l.status==='interested'?'hot':l.status==='converted'?'converted':l.unknown?'unknown':''; }

function setFilter(f){
  filter=f;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active', ['all','interested','replied','contacted','unknown','converted'][i]===f);
  });
  render();
}

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const fl=leads.filter(l=>{
    if(q&&!l.name?.toLowerCase().includes(q)&&!l.phone?.includes(q)) return false;
    if(filter==='all') return true;
    if(filter==='replied') return l.replied&&l.status!=='interested';
    if(filter==='unknown') return l.unknown;
    if(filter==='contacted') return !l.replied&&l.status==='contacted';
    return l.status===filter;
  });
  document.getElementById('list').innerHTML = fl.map(l=>`
    <div class="item${active?.phone===l.phone?' active':''}" data-phone="${l.phone}" onclick="event.preventDefault();event.stopPropagation();openChat(this.dataset.phone)">
      <div class="av ${avCls(l)}">${ini(l.name)}</div>
      <div class="info">
        <div class="name">${l.name||'Unknown'}</div>
        <div class="preview">${l.last_message||l.phone||''}</div>
      </div>
      <span class="bdg ${l.unknown?'unknown':l.status}">${l.unknown?'unknown':l.status}</span>
    </div>`).join('')||'<div style="padding:20px;color:var(--muted);font-size:.8rem;text-align:center">No leads</div>';
}

function openChat(phone){
  active=leads.find(l=>l.phone===phone);
  if(!active) return;
  render();
  document.getElementById('cav').textContent=ini(active.name);
  document.getElementById('cav').className='chat-av '+avCls(active);
  document.getElementById('cname').textContent=active.name||'Unknown';
  document.getElementById('csub').textContent=`${active.phone} · ${active.category||'N/A'} · ${active.status}`;
  const convo=active.conversation||[];
  document.getElementById('msgs').innerHTML=convo.length?
    convo.map(m=>`<div class="bubble ${m.role==='assistant'?'out':'in'}">${m.content}<div class="t">${m.time?new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</div></div>`).join(''):
    '<div class="empty-state"><p>No messages yet</p></div>';
  const msgs=document.getElementById('msgs');
  msgs.scrollTop=msgs.scrollHeight;
  // Mobile: show chat
  if(window.innerWidth<=680){
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('chat').classList.remove('hidden');
  }
}

function goBack(){
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('chat').classList.add('hidden');
}

async function fetch_data(){
  try{
    const r=await fetch('/dashboard-data');
    const d=await r.json();
    document.getElementById('st').textContent=d.total;
    document.getElementById('sc').textContent=d.contacted;
    document.getElementById('si').textContent=d.interested;
    document.getElementById('sv').textContent=d.converted;
    document.getElementById('upd').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    leads=d.leads;
    render();
    if(active){ const u=leads.find(l=>l.phone===active.phone); if(u){active=u; open(active.phone);} }
  }catch(e){ console.error(e); }
}

fetch_data();
setInterval(fetch_data, 3000);
</script>
</body>
</html>
