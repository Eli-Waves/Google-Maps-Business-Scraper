- type: cron
    name: daily-outreach
    runtime: python
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from scheduler import run_outreach; run_outreach()"
    envVars:
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: daily-scrape
    runtime: python
    schedule: "0 7 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from scheduler import scrape_until_target; scrape_until_target(20)"
    envVars:
      - key: APIFY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
